[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "traffic-signal-optimizer"
version = "1.0.0"
description = "Adaptive Traffic Signal Optimization Simulator"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-v --tb=short"

[tool.vercel]
entrypoint = "api:app"
